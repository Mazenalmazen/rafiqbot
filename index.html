<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حل الاختبار</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --primary: #1ca185;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #ddd; }
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .option-btn { 
            display: block; width: 100%; text-align: right; padding: 15px; 
            margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; 
            background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer;
        }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .loading { text-align: center; font-size: 20px; margin-top: 50px; }
        #resultCard { display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="loading" class="loading">⏳ جاري تحميل الاختبار...</div>
    
    <div id="quizContainer" style="display: none;">
        <h3 id="quizTitle" style="color: var(--primary);"></h3>
        <div class="card">
            <div class="question-text" id="qText"></div>
            <div id="optionsContainer"></div>
        </div>
        <p style="text-align:center;">السؤال <span id="currentQ">1</span> من <span id="totalQ">1</span></p>
    </div>

    <div id="resultCard" class="card">
        <h2>🎉 انتهى الاختبار!</h2>
        <p style="font-size: 24px;">نتيجتك: <span id="finalScore">0</span> / <span id="totalScore">0</span></p>
        <button onclick="tg.close()" style="padding:15px; width:100%; background:var(--primary); color:white; border:none; border-radius:8px; font-size:18px;">إغلاق</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const SUPABASE_URL = "ضع_رابط_سوباباس_هنا"; // مثال: https://atzfnyxzamwmktn.supabase.co
        const SUPABASE_ANON_KEY = "ضع_مفتاح_anon_هنا"; // المفتاح العام من إعدادات سوباباس

        let questions = [];
        let currentIndex = 0;
        let score = 0;

        // دالة لتحويل المعادلات إلى شكل جميل
        function renderMath(text) {
            return text.replace(/\$(.*?)\$/g, (match, eq) => {
                try { return katex.renderToString(eq, { throwOnError: false }); } 
                catch(e) { return match; }
            });
        }

        async function init() {
            // قراءة رقم الاختبار من رابط التليجرام
            const startParam = tg.initDataUnsafe.start_param;
            if (!startParam || !startParam.startsWith("quiz_")) {
                document.getElementById('loading').innerText = "❌ رابط غير صالح.";
                return;
            }
            const quizId = startParam.split("_")[1];

            // جلب الاختبار من سوباباس
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/quizzes?id=eq.${quizId}`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const data = await res.json();
                
                if (data.length === 0) throw new Error("غير موجود");
                
                const quiz = data[0];
                questions = quiz.questions;
                document.getElementById('quizTitle').innerText = quiz.title;
                document.getElementById('totalQ').innerText = questions.length;
                document.getElementById('totalScore').innerText = questions.length;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'block';
                showQuestion();
                
            } catch (e) {
                document.getElementById('loading').innerText = "❌ حدث خطأ أثناء تحميل الاختبار.";
            }
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('currentQ').innerText = currentIndex + 1;
            
            // عرض السؤال مع دعم المعادلات
            document.getElementById('qText').innerHTML = renderMath(q.question);
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = renderMath(opt); // دعم المعادلات في الخيارات أيضاً
                btn.onclick = () => checkAnswer(idx, q.correct_index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            // تعطيل كل الأزرار
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            
            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                // إظهار الإجابة الصحيحة
                document.querySelectorAll('.option-btn')[correct].classList.add('correct');
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < questions.length) {
                    showQuestion();
                } else {
                    finishQuiz();
                }
            }, 1500); // الانتظار ثانية ونصف قبل الانتقال
        }

        function finishQuiz() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
            
            // إرسال النتيجة للبوت
            tg.sendData(JSON.stringify({ score: score, total: questions.length }));
        }

        window.onload = init;
    </script>
</body>
</html>
